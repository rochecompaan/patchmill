<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Design review in UI workflows</title>
    <link rel="stylesheet" href="/samples/preview.css" />
  </head>
  <body>
    <h1>Design review in UI workflows</h1>
    <p>Where the two new skills join run-once for issues that change the UI.</p>
    <div class="flow">
      <div class="s">
        <div class="n"><b>Issue</b><span>label: ui</span></div>
      </div>
      <div class="s">
        <div class="a">→</div>
        <div class="n hot"><b>Brainstorm</b><span>frontend-design</span></div>
      </div>
      <div class="s">
        <div class="a">→</div>
        <div class="n hot"><b>Spec</b><span>links a mockup</span></div>
      </div>
      <div class="s">
        <div class="a">→</div>
        <div class="n"><b>Plan</b><span>writing-plans</span></div>
      </div>
      <div class="s">
        <div class="a">→</div>
        <div class="n hot"><b>Implement</b><span>frontend-design</span></div>
      </div>
      <div class="s">
        <div class="a">→</div>
        <div class="n"><b>Code review</b><span>reviewer</span></div>
      </div>
      <div class="s">
        <div class="a">→</div>
        <div class="n hot"><b>Design review</b><span>fresh context</span></div>
      </div>
    </div>
    <p class="key"><i></i>Changed by this plan</p>
  </body>
</html>
