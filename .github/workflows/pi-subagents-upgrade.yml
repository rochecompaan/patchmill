name: pi-subagents dependency upgrade

on:
  schedule:
    - cron: "7 7 * * *"
  workflow_dispatch:
    inputs:
      pi-subagents-version:
        description: "Explicit stable pi-subagents version"
        required: false
        type: string
      validate-only:
        description: "Validate the selected version without opening a PR"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: pi-subagents-dependency-upgrade
  cancel-in-progress: false

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Update pi-subagents dependency metadata
        id: update
        env:
          PI_SUBAGENTS_VERSION: ${{ inputs.pi-subagents-version }}
          VALIDATE_ONLY: ${{ inputs.validate-only || false }}
        run: |
          set -euo pipefail
          mkdir -p .tmp
          args=(--summary-json .tmp/pi-subagents-summary.json)
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            args+=(--mode manual)
            [[ -n "${PI_SUBAGENTS_VERSION:-}" ]] && args+=(--pi-subagents-version "$PI_SUBAGENTS_VERSION")
            [[ "$VALIDATE_ONLY" == "true" ]] && args+=(--validate-only)
          else
            args+=(--mode scheduled)
          fi
          node scripts/update-pi-subagents.mjs "${args[@]}"
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require("node:fs");
          const summary = JSON.parse(fs.readFileSync(".tmp/pi-subagents-summary.json", "utf8"));
          console.log(`no_update=${summary.noUpdate ? "true" : "false"}`);
          console.log(`validate_only=${summary.validateOnly ? "true" : "false"}`);
          console.log(`should_validate=${!summary.noUpdate || summary.validateOnly ? "true" : "false"}`);
          console.log(`target_version=${summary.targetVersion}`);
          NODE

      - name: Reinstall updated dependencies
        if: steps.update.outputs.should_validate == 'true'
        run: npm ci

      - name: Run pi-subagents dependency contract
        if: steps.update.outputs.should_validate == 'true'
        run: node --test src/pi/pi-subagents-dependency-contract.test.ts

      - name: Set up Bun
        if: steps.update.outputs.should_validate == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Run pi-subagents Bun workflow contract
        if: steps.update.outputs.should_validate == 'true'
        run: bun scripts/verify-pi-subagents-bun-workflow.mjs

      - name: Run Node tests
        if: steps.update.outputs.should_validate == 'true'
        run: npm test

      - name: Run packed artifact smoke test
        if: steps.update.outputs.should_validate == 'true'
        run: node scripts/smoke-packed-artifact.mjs

      - name: Run lint
        if: steps.update.outputs.should_validate == 'true'
        run: npm run lint

      - name: Verify Nix npm dependency hash
        if: steps.update.outputs.should_validate == 'true'
        run: |
          cp nix/package.nix .tmp/nix-package.nix.before-hash
          scripts/update-npm-deps-hash.sh
          if ! cmp --silent .tmp/nix-package.nix.before-hash nix/package.nix; then
            echo "::error file=nix/package.nix::npmDepsHash is stale after the pi-subagents update."
            exit 1
          fi

      - name: Build Nix package
        if: steps.update.outputs.should_validate == 'true'
        run: nix build .#patchmill --print-build-logs

      - name: Verify packaged Pi extension loading
        if: steps.update.outputs.should_validate == 'true'
        run: |
          cd result/share/patchmill
          node --test \
            --test-name-pattern='pi loads the resolved pi-subagents extension package without model execution' \
            src/pi/pi-subagents-dependency-contract.test.ts

      - name: Run full flake check
        if: steps.update.outputs.should_validate == 'true'
        run: nix flake check --accept-flake-config --print-build-logs

      - name: Render pull request body
        if: >-
          steps.update.outputs.no_update != 'true' &&
          steps.update.outputs.validate_only != 'true'
        run: |
          node -e 'import("./scripts/pi-subagents-upgrade-lib.mjs").then(({renderPiSubagentsPullRequestBody}) => { const fs = require("node:fs"); const summary = JSON.parse(fs.readFileSync(".tmp/pi-subagents-summary.json", "utf8")); fs.writeFileSync(".tmp/pi-subagents-pr-body.md", renderPiSubagentsPullRequestBody(summary)); })'

      - name: Create automation bot token
        id: app-token
        if: >-
          steps.update.outputs.no_update != 'true' &&
          steps.update.outputs.validate_only != 'true'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_BOT_PRIVATE_KEY }}

      - name: Create or update pi-subagents upgrade PR
        if: >-
          steps.update.outputs.no_update != 'true' &&
          steps.update.outputs.validate_only != 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          add-paths: |
            package.json
            package-lock.json
            npm-shrinkwrap.json
            nix/package.nix
          branch:
            automation/pi-subagents-${{ steps.update.outputs.target_version }}
          delete-branch: true
          title: >-
            chore(deps): update pi-subagents to ${{
            steps.update.outputs.target_version }}
          body-path: .tmp/pi-subagents-pr-body.md
          commit-message: >-
            chore(deps): update pi-subagents to ${{
            steps.update.outputs.target_version }}
          labels: dependencies, automated-pr
