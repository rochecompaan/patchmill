      // ---------------------------------------------------------------------------

      const esc = (s) =>
        String(s).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );

      const ICON = {
        play: '<svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path d="M4 2.5v11l9-5.5z" fill="currentColor"/></svg>',
        pause:
          '<svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><rect x="3.5" y="2.5" width="3" height="11" rx="1" fill="currentColor"/><rect x="9.5" y="2.5" width="3" height="11" rx="1" fill="currentColor"/></svg>',
        retry:
          '<svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M13 8a5 5 0 1 1-1.6-3.7"/><path d="M13 2.5v3h-3"/></svg>',
        stop: '<svg viewBox="0 0 16 16" width="11" height="11" aria-hidden="true"><rect x="3" y="3" width="10" height="10" rx="1.5" fill="currentColor"/></svg>',
        term: '<svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="11" rx="2"/><path d="M4.5 6l2 2-2 2M8.5 10.5h3"/></svg>',
        wrench:
          '<svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.5 2.2a3.5 3.5 0 0 0-4.3 4.6L2.4 10.6a1.4 1.4 0 0 0 2 2l3.8-3.8a3.5 3.5 0 0 0 4.6-4.3l-2 2-1.9-.4-.4-1.9z"/></svg>',
        robot:
          '<svg width="15" height="11" aria-hidden="true" style="color:var(--dim)"><use href="#sym-head"/></svg>',
        pr: '<svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="4" cy="3.5" r="1.6"/><circle cx="4" cy="12.5" r="1.6"/><circle cx="12" cy="12.5" r="1.6"/><path d="M4 5.1v5.8M12 10.9V6.5a2 2 0 0 0-2-2H7.5M9 3L7.5 4.5 9 6"/></svg>',
      };

      const ART_ICON = {
        spec: '<path d="M4 1.5h5.5l3 3v10h-8.5z"/><path d="M9.5 1.5v3h3M6 8h4.5M6 10.5h4.5"/>',
        plan: '<path d="M2.5 4l1.2 1.2L6 3M2.5 9l1.2 1.2L6 8M8.5 4.5h5M8.5 9.5h5M3 13h1M8.5 13h5"/>',
        mockup:
          '<rect x="1.5" y="2.5" width="13" height="11" rx="1.5"/><path d="M1.5 5.5h13M6 5.5v8"/>',
        diagram:
          '<rect x="1.5" y="2" width="5" height="4" rx="1"/><rect x="9.5" y="10" width="5" height="4" rx="1"/><path d="M4 6v2.5A1.5 1.5 0 0 0 5.5 10h4"/>',
        shots:
          '<rect x="1.5" y="2.5" width="13" height="11" rx="1.5"/><circle cx="5.5" cy="6" r="1.3"/><path d="M14.5 11L11 7.5l-6.5 6"/>',
        external:
          '<path d="M9 2.5h4.5V7M13.5 2.5l-6 6M12 9.5V13a1 1 0 0 1-1 1H3.5a1 1 0 0 1-1-1V5.5a1 1 0 0 1 1-1H7"/>',
      };
      const artIcon = (kind, size = 13) =>
        `<svg viewBox="0 0 16 16" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ART_ICON[kind]}</svg>`;

      const GLYPH = {
        advance: '<span class="glyph g-plus">+</span>',
        neutral: '<span class="glyph g-eq">=</span>',
        blocked: '<span class="glyph g-minus">−</span>',
      };
      // Name colours live in the theme (--who-1 to --who-5) so they stay readable.
      const PERSON_COLOURS = [1, 2, 3, 4, 5].map((i) => `var(--who-${i})`);

      function personColour(name) {
        if (name === "roche") return PERSON_COLOURS[0];
        let h = 0;
        for (const c of name) h = (h * 31 + c.charCodeAt(0)) >>> 0;
        return PERSON_COLOURS[1 + (h % (PERSON_COLOURS.length - 1))];
      }
      function avatarPerson(name, small = false) {
        return `<span class="av av-person${small ? " sm" : ""}" style="--who:${personColour(name)}" title="${esc(name)}">${esc(name.slice(0, 2))}</span>`;
      }
      function avatarAgent(live = false) {
        return `<span class="av av-agent${live ? " is-live" : ""}" aria-hidden="true"><svg class="ring"><use href="#sym-ring"/></svg><svg class="head"><use href="#sym-head"/></svg></span>`;
      }

      function labelChip(l) {
        const cls =
          l === "agent-ready"
            ? "l-ready"
            : l === "needs-info"
              ? "l-info"
              : l === "agent-unsuitable"
                ? "l-unsuitable"
                : l === "blocked"
                  ? "l-blocked"
                  : "";
        return `<span class="label ${cls}">${esc(l)}</span>`;
      }

      function formatArgs(args) {
        return Object.entries(args)
          .map(([k, v]) => {
            const s = typeof v === "string" ? v : JSON.stringify(v);
            return `${k}=${s.length > 90 ? s.slice(0, 87) + "..." : s}`;
          })
          .join(", ");
      }

      // ---------------------------------------------------------------------------
      // Board
      // ---------------------------------------------------------------------------

      function renderBoard() {
        const all = ISSUES.filter(
          (issue) => !issue.labels.includes("agent-unsuitable"),
        ).map((i) => view(i.n));
        return `
    <section aria-label="Issues">
      <svg class="board-watermark" aria-hidden="true"><use href="#sym-wheel"/></svg>
      <div class="board">
        ${COLUMNS.map((c) =>
          renderColumn(
            c,
            all.filter((v) => v.col === c.id),
          ),
        ).join("")}
      </div>
    </section>`;
      }

      function renderColumn(c, items) {
        return `
    <section class="col" aria-label="${esc(c.name)}">
      <header class="col-head">
        <div class="col-title"><span>${esc(c.name)}</span><span class="col-count">${items.length}</span></div>
        <div class="col-desc">${esc(c.desc)}</div>
      </header>
      <div class="cards">${items.length ? items.map(renderCard).join("") : '<div class="col-empty">Nothing here</div>'}</div>
    </section>`;
      }

      function renderCard(v) {
        const markers = [];
        if (v.status === "working")
          markers.push('<span class="mk mk-live"><i></i>Live</span>');
        if (v.status === "waiting")
          markers.push(
            '<span class="mk mk-wait"><i></i>Waiting for reply</span>',
          );
        if (v.status === "paused")
          markers.push('<span class="mk mk-paused">Paused</span>');
        if (v.terminal)
          markers.push(`<span class="mk mk-term">${ICON.term}Terminal</span>`);
        const cls =
          v.status === "working"
            ? "is-live"
            : v.status === "waiting"
              ? "is-waiting"
              : v.status === "blocked"
                ? "is-blocked"
                : "";
        const running =
          ["working", "waiting", "idle", "paused"].includes(v.status) && v.step;
        const prs = (v.prs || [])
          .map((p) => `<span class="card-pr">${ICON.pr}${esc(p.label)}</span>`)
          .join("");
        return `
    <article class="card ${cls}">
      <a class="card-main" href="#/issue/${v.n}">
        <div class="card-num">#${v.n}</div>
        <div class="card-title">${esc(v.title)}</div>
      </a>
      ${running ? `<div class="card-step">${esc(v.step)}</div>` : ""}
      ${v.status === "blocked" && v.error ? `<div class="card-error">${GLYPH.blocked} ${esc(v.error)}</div>` : ""}
      ${markers.length || prs ? `<div class="card-row">${markers.join("")}${prs}</div>` : ""}
      ${v.labels.length ? `<div class="card-row">${v.labels.map(labelChip).join("")}</div>` : ""}
      <div class="card-row card-links">
        ${artifactsFor(v)
          .filter((a) => ["spec", "plan"].includes(a.kind))
          .map(
            (a) =>
              `<a href="#/issue/${v.n}?artifact=${a.kind}">${ART_KINDS[a.kind].name}</a>`,
          )
          .join("")}
        ${(v.prs || []).map((p) => `<a href="${gh("pull", p.n)}" target="_blank" rel="noopener noreferrer">${esc(p.label)}</a>`).join("")}
      </div>
    </article>`;
      }

      // ---------------------------------------------------------------------------
      // Issue page
      // ---------------------------------------------------------------------------

      function renderIssue(n) {
        const v = view(n);
        const events = threadFor(v);
        const body =
          v.status === "none" && events.length === 0
            ? renderEmpty()
            : renderThread(v, events);
        return `${renderHeader(v)}<section class="thread" aria-live="polite">${body}</section>${renderComposer(v)}`;
      }

      function renderHeader(v) {
        return `
    <header class="ihead"><div class="ihead-inner">
      <a class="back" href="#/board">← Board</a>
      <div class="ihead-top">
        <h1 class="ititle">${v.sampleState ? `<span class="inum">#${v.n}</span>` : `<a class="inum" href="${gh("issues", v.n)}" target="_blank" rel="noopener noreferrer">#${v.n}</a>`}${esc(v.title)}</h1>
        <div class="control">${renderControl(v)}</div>
      </div>
      ${renderRail(v)}
      <div class="meta">${renderMeta(v)}</div>
      ${renderArtifacts(v)}
    </div></header>`;
      }

      function renderControl(v) {
        if (v.terminal)
          return `<span class="note-pill">${ICON.term} Running in a terminal</span>`;
        switch (v.status) {
          case "none":
            return `<button class="btn btn-primary" data-action="start">${ICON.play} Start planning</button>`;
          case "working":
          case "waiting":
          case "idle":
            return `<button class="btn" data-action="pause" title="Stops the run like Ctrl-C. The worktree and session are kept.">${ICON.pause} Pause</button>`;
          case "paused":
            return `<button class="btn btn-live" data-action="resume">${ICON.play} Resume</button>`;
          case "blocked":
            return `<button class="btn btn-danger" data-action="retry">${ICON.retry} Retry</button>`;
          default:
            return "";
        }
      }

      function renderRail(v) {
        const phase = v.phase ?? -1;
        const items = PHASES.map((p, i) => {
          let cls = "";
          if (i < phase) cls = "done";
          if (i === phase)
            cls = v.status === "blocked" ? "current is-blocked" : "current";
          return `<li class="${cls}"${i === phase ? ' aria-current="step"' : ""}>${esc(p.name)}${p.pr ? '<span class="pr-tag">PR</span>' : ""}</li>`;
        });
        return `<ol class="rail" aria-label="Workflow" data-key="${v.n}:${phase}:${v.status}">${items.join("")}</ol>`;
      }

      const STATUS_TEXT = {
        none: ["dot", "Not started"],
        working: ["dot dot-live", "Agent working"],
        waiting: ["dot dot-wait", "Waiting for reply"],
        idle: ["dot", "Agent idle"],
        paused: ["dot", "Paused"],
        blocked: ["dot dot-blocked", "Blocked"],
        done: ["dot", "Finished"],
      };

      function renderMeta(v) {
        const [dot, text] = STATUS_TEXT[v.status];
        const parts = [
          `<span class="meta-item"><i class="${dot}"></i><b>${text}</b></span>`,
        ];
        if (v.step)
          parts.push(
            `<span class="meta-item mono">step <b>${esc(v.step)}</b></span>`,
          );
        if (v.elapsed)
          parts.push(
            `<span class="meta-item mono">elapsed <b>${esc(v.elapsed)}</b></span>`,
          );
        for (const p of v.prs || []) {
          parts.push(
            `<span class="meta-item"><a class="pr-link" href="${gh("pull", p.n)}" target="_blank" rel="noopener noreferrer">${ICON.pr}${esc(p.label)}</a><span class="pr-state">${esc(p.state)}</span></span>`,
          );
        }
        if (v.status === "done" && v.cost)
          parts.push(
            `<span class="meta-item mono">cost <b>${esc(v.cost)}</b> · ${esc(v.tokens)} tokens</span>`,
          );
        const here = v.presence
          ? [...new Set([app.me, ...v.presence])]
          : [app.me];
        parts.push(
          `<span class="meta-item">here now <span class="presence">${here.map((p) => avatarPerson(p, true)).join("")}</span></span>`,
        );
        return parts.join("");
      }

      function renderArtifacts(v) {
        const arts = artifactsFor(v);
        if (!arts.length) return "";
        const groups = Object.entries(ART_GROUPS).map(([group, label]) => {
          const items = arts.filter((a) => ART_KINDS[a.kind].group === group);
          if (!items.length) return "";
          return `<div class="art-group" role="group" aria-label="${label} artifacts"><span class="art-label" aria-hidden="true">${label}</span>${items.map(renderChip).join("")}</div>`;
        });
        return `<div class="artifacts">${groups.join("")}</div>`;
      }

      function renderChip(a) {
        const count = a.shots
          ? `<span class="art-count">${a.shots.length}</span>`
          : "";
        const draft = a.draft ? '<span class="art-draft">draft</span>' : "";
        return `<button type="button" class="art-chip${a.draft ? " is-draft" : ""}" data-action="art" data-kind="${a.kind}" data-art-key="chip:${a.kind}" aria-haspopup="dialog">${artIcon(a.kind)}${ART_KINDS[a.kind].name}${count}${draft}</button>`;
      }

      function renderEmpty() {
        return `
    <div class="empty">
      <svg aria-hidden="true"><use href="#sym-wheel"/></svg>
      <h2>No run yet</h2>
      <p>Start planning to brainstorm this issue with an agent. The agent starts with read-only tools. It writes the spec only after you agree on a design.</p>
      <button class="btn btn-primary" data-action="start">${ICON.play} Start planning</button>
    </div>`;
      }

      function renderThread(v, events) {
        const seen = app.seen[v.n] ?? events.length;
        let stepLabel = "";
        const out = events.map((e, i) => {
          if (e.t === "step") stepLabel = e.label;
          const isNew = i >= seen ? " is-new" : "";
          return renderEvent(v, e, i, stepLabel, isNew);
        });
        const last = events[events.length - 1];
        if (
          v.status === "working" &&
          !(last && last.t === "tool" && last.running)
        ) {
          out.push(
            `<div class="ev ev-live"><div class="gutter">${avatarAgent(true)}</div><div class="live-text">The agent is working<span class="dots"><i></i><i></i><i></i></span></div></div>`,
          );
        }
        app.seen[v.n] = events.length;
        return out.join("");
      }

      function renderEvent(v, e, i, stepLabel, isNew) {
        switch (e.t) {
          case "divider":
            return `<div class="ev-divider tone-${e.tone}${isNew}"><span class="div-text">${GLYPH[e.tone]}<span>${esc(e.text)}</span>${e.time ? `<time>${e.time}</time>` : ""}</span></div>`;
          case "step":
            return `<div class="ev ev-machine ev-step${isNew}"><div class="gutter"><i class="node"></i></div><div class="step-line"><span class="step-num">${esc(e.n)}</span>${esc(e.label)}</div></div>`;
          case "tokens":
            return `<div class="ev ev-machine${isNew}"><div class="gutter"></div><div class="tokens">tokens: task ${e.task} total ${e.total}   time elapsed: ${e.time}</div></div>`;
          case "tool":
            return renderTool(v, e, i, isNew);
          case "msg":
            return renderMessage(e, stepLabel, isNew);
          case "error":
            return `<div class="ev ev-error${isNew}"><div class="gutter"></div><div class="error-box"><div class="error-title">${GLYPH.blocked}${esc(e.title)}</div><pre>${esc(e.body)}</pre></div></div>`;
          case "earlier":
            return `<div class="ev${isNew}"><div class="gutter"></div><button class="earlier" data-action="earlier">▸ ${esc(e.text)}. Show earlier steps</button></div>`;
          case "info":
            return `<div class="ev ev-machine${isNew}"><div class="gutter"></div><div class="info-line">${esc(e.text)}</div></div>`;
          case "art":
            return renderArtCard(v, e, i, isNew);
          default:
            return "";
        }
      }

      function renderTool(v, e, i, isNew) {
        const running = e.running && v.status === "working";
        const stopped = e.running && v.status !== "working";
        const isSub = e.name === "subagent";
        const lead = running
          ? '<span class="spinner" aria-label="running"></span>'
          : isSub
            ? ICON.robot
            : ICON.wrench;
        const nameCls =
          e.name === "patchmill_advance" ? "tool-name is-advance" : "tool-name";
        const state = running ? "running" : stopped ? "stopped" : "";
        const detail = `<div class="td-label">arguments</div><pre>${esc(JSON.stringify(e.args, null, 2))}</pre>${e.result ? `<div class="td-label">result</div><pre>${esc(e.result)}</pre>` : ""}`;
        return `
    <div class="ev ev-machine${isNew}"><div class="gutter"></div>
      <details class="tool${running ? " is-running" : ""}" data-key="${v.n}:${i}">
        <summary>${lead}<span class="${nameCls}">${esc(e.name)}</span><span class="tool-args">(${esc(formatArgs(e.args))})</span>${state ? `<span class="tool-state">${state}</span>` : ""}</summary>
        <div class="tool-detail">${detail}</div>
      </details>
    </div>`;
      }

      function renderMessage(e, stepLabel, isNew) {
        const isAgent = e.who === "agent";
        const name = e.who === "me" ? app.me : e.who;
        const tag =
          isAgent && stepLabel
            ? `<span class="msg-tag">${esc(stepLabel)}${stepLabel === "brainstorm" ? " · read-only tools" : ""}</span>`
            : "";
        const notes = [];
        if (e.steer)
          notes.push(
            `<div class="msg-note">${GLYPH.neutral}sent while the agent was working · it read this after its current tool call</div>`,
          );
        if (e.mock) notes.push('<div class="msg-note">mockup reply</div>');
        return `
    <article class="ev ev-msg ${isAgent ? "agent" : "person"}${e.mock ? " is-mock" : ""}${isNew}"${isAgent ? "" : ` style="--who:${personColour(name)}"`}>
      <div class="gutter">${isAgent ? avatarAgent(false) : avatarPerson(name)}</div>
      <div class="msg-body">
        <header class="msg-head"><span class="msg-name">${esc(isAgent ? "agent" : name)}</span>${tag}<time>${esc(e.time)}</time></header>
        <div class="prose">${e.html}</div>
        ${notes.join("")}
      </div>
    </article>`;
      }

      function renderArtCard(v, e, i, isNew) {
        const a = artifactsFor(v).find((x) => x.kind === e.kind);
        if (!a) return "";
        const k = ART_KINDS[e.kind];
        return `
    <div class="ev ev-art${isNew}"><div class="gutter"></div>
      <div class="art-card">
        <span class="art-card-icon">${artIcon(e.kind, 16)}</span>
        <span class="art-card-text"><b>${esc(e.text)}</b><code>${esc(a.summary || a.path)}</code></span>
        <button type="button" class="btn btn-sm" data-action="art" data-kind="${e.kind}" data-art-key="card:${i}" aria-haspopup="dialog" aria-label="Open ${esc((k.long || k.name).toLowerCase())}">Open</button>
      </div>
    </div>`;
      }

      const COMPOSER = {
        none: {
          disabled: true,
          dot: "dot",
          hint: "Click Start planning to brainstorm this issue with an agent.",
        },
        working: {
          stop: true,
          dot: "dot dot-live",
          hint: "The agent is working. Your message reaches it after its current tool call.",
        },
        waiting: {
          dot: "dot dot-wait",
          hint: "The agent is waiting for your reply.",
        },
        idle: {
          dot: "dot",
          hint: "The agent is idle. Your message starts a new turn.",
        },
        paused: {
          disabled: true,
          dot: "dot",
          hint: "This run is paused. Click Resume to keep chatting.",
        },
        blocked: {
          disabled: true,
          dot: "dot dot-blocked",
          hint: "This run is blocked. Fix the cause, then click Retry.",
        },
      };

      function renderComposer(v) {
        if (v.terminal) {
          return `<footer class="composer"><div class="note-bar">${ICON.term}<span>View only. This run was started in a terminal with <code>patchmill run-once --issue ${v.n}</code>. Chat works only for runs started from this page.</span></div></footer>`;
        }
        if (v.status === "done") {
          const pr = v.prs[0];
          return `<footer class="composer"><div class="note-bar">${GLYPH.advance}<span>This run has finished. Review continues on <a href="${gh("pull", pr.n)}" target="_blank" rel="noopener noreferrer">${esc(pr.label)}</a>.</span></div></footer>`;
        }
        const c = COMPOSER[v.status];
        const dis = c.disabled ? " disabled" : "";
        return `
    <footer class="composer">
      <form class="composer-box${c.disabled ? " is-disabled" : ""}" id="composer" data-n="${v.n}">
        <textarea id="composer-input" rows="1" placeholder="Message the agent as ${esc(app.me)}" aria-label="Message the agent"${dis}></textarea>
        ${c.stop ? `<button type="button" class="btn btn-stop" data-action="stop-reply" title="Stops only the agent's current reply">${ICON.stop} Stop reply</button>` : ""}
        <button type="submit" class="btn btn-primary"${dis}>Send</button>
      </form>
      <p class="composer-hint"><i class="${c.dot}"></i><span>${c.hint}</span><span class="kbd-hint">Enter to send · Shift+Enter for a new line</span></p>
    </footer>`;
      }

      // ---------------------------------------------------------------------------
      // Render and routing
      // ---------------------------------------------------------------------------

      let lastScrollKey = "";

      function openLinkedArtifact() {
        const query = location.hash.split("?")[1] || "";
        const kind = new URLSearchParams(query).get("artifact");
        if (!["spec", "plan"].includes(kind)) return;
        const trigger = document.querySelector(`[data-kind="${kind}"]`);
        if (trigger) openViewer(trigger);
      }

      function render() {
        const appEl = document.getElementById("app");
        const ta = document.getElementById("composer-input");
        const previousIssue = ta?.closest("form")?.dataset.n;
        if (previousIssue) app.drafts[previousIssue] = ta.value;
        const draft =
          app.route.view === "issue" ? app.drafts[app.route.n] || "" : "";
        const hadFocus =
          ta &&
          document.activeElement === ta &&
          Number(previousIssue) === app.route.n;
        const openTools = new Set(
          [...document.querySelectorAll("details.tool[open]")].map(
            (d) => d.dataset.key,
          ),
        );
        const oldRail = document.querySelector(".rail");
        const railWas = oldRail && {
          key: oldRail.dataset.key,
          left: oldRail.scrollLeft,
        };

        appEl.innerHTML =
          app.route.view === "issue" ? renderIssue(app.route.n) : renderBoard();
        document.getElementById("me-name").textContent = app.me;
        document.getElementById("me-initials").textContent = app.me.slice(0, 2);
        document
          .getElementById("me-initials")
          .style.setProperty("--who", personColour(app.me));

        document.querySelectorAll("details.tool").forEach((d) => {
          if (openTools.has(d.dataset.key)) d.open = true;
        });
        // On narrow screens the rail scrolls sideways. Centre the current step when
        // the issue or step changes; otherwise keep where the person scrolled to.
        const rail = document.querySelector(".rail");
        const cur = rail?.querySelector('[aria-current="step"]');
        if (rail && railWas?.key === rail.dataset.key)
          rail.scrollLeft = railWas.left;
        else if (cur)
          rail.scrollLeft +=
            cur.getBoundingClientRect().left -
            rail.getBoundingClientRect().left -
            (rail.clientWidth - cur.offsetWidth) / 2;
        const nta = document.getElementById("composer-input");
        if (nta) {
          nta.value = draft;
          autosize(nta);
          if (hadFocus && !nta.disabled) nta.focus();
        }

        // Follow the newest activity, like a chat.
        if (app.route.view === "issue") {
          const key = `${app.route.n}:${(app.extra[app.route.n] || []).length}:${view(app.route.n).status}:${app.s227}`;
          if (key !== lastScrollKey)
            window.scrollTo({ top: document.body.scrollHeight });
          lastScrollKey = key;
        } else {
          lastScrollKey = "";
        }
      }

      function parseRoute() {
        const h = location.hash.replace(/^#\/?/, "");
        const [path, query] = h.split("?");
        const parts = path.split("/");
        if (
          parts[0] === "issue" &&
          ISSUES.some((i) => i.n === Number(parts[1]))
        ) {
          const n = Number(parts[1]);
          return { view: "issue", n };
        }
        return { view: "board" };
      }

      function go(hash) {
        if (location.hash === hash) {
          app.route = parseRoute();
          render();
        } else location.hash = hash;
      }

      window.addEventListener("hashchange", () => {
        closeViewer(false);
        const prev = app.route;
        app.route = parseRoute();
        if (app.route.view !== prev.view || app.route.n !== prev.n)
          window.scrollTo({ top: 0 });
        render();
        openLinkedArtifact();
      });

      // ---------------------------------------------------------------------------
      // Actions
      // ---------------------------------------------------------------------------

      function showNote() {
        const notice = document.getElementById("notice");
        notice.hidden = false;
        notice.textContent = "This comes with live chat. Nothing changed.";
      }

      function act(kind) {
        if (["start", "pause", "resume", "retry", "stop-reply"].includes(kind))
          showNote();
        if (kind === "earlier") {
          const notice = document.getElementById("notice");
          notice.hidden = false;
          notice.textContent =
            "These are sample steps. No earlier history is loaded.";
        }
      }

      function send() {
        showNote();
      }

      function autosize(ta) {
        ta.style.height = "auto";
        ta.style.height = `${Math.min(ta.scrollHeight, 200)}px`;
      }

      document.addEventListener("click", (e) => {
        const t = e.target;
        const action = t.closest("[data-action]");
        if (action) {
          if (action.dataset.action === "name") return openNameDialog();
          if (action.dataset.action === "theme") return toggleTheme(action);
          if (action.dataset.action === "art") return openViewer(action);
          if (app.route.view === "issue")
            act(action.dataset.action, app.route.n);
          return;
        }
      });

      document.addEventListener("submit", (e) => {
        if (e.target.id !== "composer") return;
        e.preventDefault();
        const ta = document.getElementById("composer-input");
        const text = ta.value.trim();
        if (!text) return;
        send(Number(e.target.dataset.n), text);
      });

      document.addEventListener("keydown", (e) => {
        if (
          e.target.id === "composer-input" &&
          e.key === "Enter" &&
          !e.shiftKey &&
          !e.isComposing
        ) {
          e.preventDefault();
          document.getElementById("composer").requestSubmit();
        }
      });

      document.addEventListener("input", (e) => {
        if (e.target.id === "composer-input") autosize(e.target);
      });

      function openNameDialog() {
        const dlg = document.getElementById("name-dialog");
        document.getElementById("name-input").value = app.me;
        dlg.showModal();
      }

      document.getElementById("name-dialog").addEventListener("close", (e) => {
        const dlg = e.target;
        const name = document.getElementById("name-input").value.trim();
        if (dlg.returnValue === "save" && name) {
          app.me = name;
          saveName(name);
          render();
        }
      });

      // ---------- artifact viewer ----------
      const VIEWER = document.getElementById("viewer");
      let viewerUrl = "";

      function openViewer(trigger) {
        const a = artifactsFor(view(app.route.n)).find(
          (x) => x.kind === trigger.dataset.kind,
        );
        if (!a) return;
        // "Open in new tab" needs a URL. The real server serves the file itself.
        if (viewerUrl) URL.revokeObjectURL(viewerUrl);
        viewerUrl = a.html
          ? URL.createObjectURL(new Blob([a.html], { type: "text/html" }))
          : "";
        app.viewer = { a, idx: 0, key: trigger.dataset.artKey, restore: true };
        renderViewer();
        VIEWER.showModal();
      }

      function closeViewer(restore = true) {
        if (!app.viewer) return;
        app.viewer.restore = restore;
        VIEWER.close();
      }

      // Focus goes back to the chip or card that opened the viewer. The page may
      // have re-rendered while the viewer was open, so look the button up again.
      VIEWER.addEventListener("close", () => {
        const v = app.viewer;
        app.viewer = null;
        if (v?.restore)
          document.querySelector(`[data-art-key="${v.key}"]`)?.focus();
      });

      VIEWER.addEventListener("click", (e) => {
        if (e.target === VIEWER) return closeViewer(); // the backdrop
        const b = e.target.closest("[data-vw]");
        if (!b) return;
        if (b.dataset.vw === "close") return closeViewer();
        if (b.dataset.vw === "prev") moveShot(-1);
        if (b.dataset.vw === "next") moveShot(1);
        if (b.dataset.vw === "shot")
          moveShot(Number(b.dataset.idx) - app.viewer.idx);
      });

      VIEWER.addEventListener("keydown", (e) => {
        if (!app.viewer?.a.shots) return;
        if (e.key === "ArrowLeft") moveShot(-1);
        if (e.key === "ArrowRight") moveShot(1);
      });

      function moveShot(step) {
        const count = app.viewer.a.shots.length;
        app.viewer.idx = (app.viewer.idx + step + count) % count;
        renderViewer();
      }

      // Re-render the panel and keep keyboard focus on the same control.
      function renderViewer() {
        const el = document.getElementById("vw");
        const f = document.activeElement?.closest?.("[data-vw]");
        const sel =
          f && el.contains(f)
            ? f.dataset.vw === "shot"
              ? `[data-vw="shot"][data-idx="${app.viewer.idx}"]`
              : `[data-vw="${f.dataset.vw}"]`
            : "";
        el.innerHTML = viewerHtml(app.viewer);
        if (sel) el.querySelector(sel)?.focus();
      }

      function viewerHtml({ a, idx }) {
        const k = ART_KINDS[a.kind];
        const shot = a.shots?.[idx];
        const path = shot ? shot.path : a.path;
        const onGitHub = a.commit && a.pushed !== false;
        const actions = [
          onGitHub &&
            `<a class="btn btn-sm" href="https://github.com/${REPO}/blob/${a.commit}/${path}" target="_blank" rel="noopener noreferrer">${artIcon("external")} View on GitHub</a>`,
          viewerUrl &&
            `<a class="btn btn-sm" href="${viewerUrl}" target="_blank" rel="noopener">${artIcon("external")} Open in new tab</a>`,
        ].filter(Boolean);
        return `
    <div class="vw-head">
      <div class="vw-kind">${esc(k.long || k.name)}</div>
      <h2 id="vw-title">${artIcon(a.kind, 18)}${esc(a.title)}${a.draft ? '<span class="art-draft">draft</span>' : ""}</h2>
      <div class="vw-meta"><code>${esc(a.path)}</code><span>${a.commit ? `at <code>${a.commit}</code>` : "Not committed"}</span><span>${esc(a.where)}</span></div>
      ${actions.length ? `<div class="vw-actions">${actions.join("")}</div>` : ""}
      <button type="button" class="vw-close" data-vw="close" aria-label="Close" autofocus>×</button>
    </div>
    ${viewerBody(a, idx)}`;
      }

      function viewerBody(a, idx) {
        if (a.doc)
          return `<div class="vw-body"><article class="md-body">${a.doc}</article></div>`;
        if (a.html)
          return `<div class="vw-body is-frame"><iframe class="art-frame" title="${esc(a.title)}" sandbox="allow-same-origin" srcdoc="${esc(a.html)}"></iframe><p class="vw-note">Sample preview. Scripts are off. The file cannot read this page or act as you.</p></div>`;
        const s = a.shots[idx];
        const thumbs = a.shots
          .map(
            (t, j) =>
              `<button type="button" class="thumb" data-vw="shot" data-idx="${j}" aria-label="Screenshot ${j + 1}: ${esc(t.caption)}" aria-current="${j === idx}">${shotSvg(t.draw)}</button>`,
          )
          .join("");
        return `
    <div class="vw-body">
      <figure class="gallery">
        <div class="shot">${shotSvg(s.draw, s.caption)}</div>
        <figcaption><b>${esc(s.caption)}</b><code>${esc(s.path)}</code></figcaption>
      </figure>
      <div class="gal-nav">
        <button type="button" class="btn btn-sm" data-vw="prev" aria-label="Previous screenshot">←</button>
        <span class="gal-count" aria-live="polite">${idx + 1} / ${a.shots.length}</span>
        <button type="button" class="btn btn-sm" data-vw="next" aria-label="Next screenshot">→</button>
        <div class="thumbs">${thumbs}</div>
      </div>
    </div>`;
      }

      // ---------- theme ----------
      const THEME_KEY = "patchmill-theme";

      function savedTheme() {
        try {
          const saved = localStorage.getItem(THEME_KEY);
          return ["light", "dark"].includes(saved) ? saved : null;
        } catch {
          return null;
        }
      }
      function currentTheme() {
        return document.documentElement.dataset.theme === "light"
          ? "light"
          : "dark";
      }
      function syncThemeSwitch() {
        const light = currentTheme() === "light";
        const sw = document.getElementById("theme-switch");
        sw.setAttribute("aria-checked", String(light));
        sw.title = light ? "Switch to dark theme" : "Switch to light theme";
      }
      function applyTheme(theme, origin) {
        const swap = () => {
          document.documentElement.dataset.theme = theme;
          syncThemeSwitch();
        };
        const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
        if (!origin || calm || !document.startViewTransition) return swap();
        // The new theme opens as a circle from the switch.
        const r = origin.getBoundingClientRect();
        const x = r.left + r.width / 2;
        const y = r.top + r.height / 2;
        const end = Math.hypot(
          Math.max(x, innerWidth - x),
          Math.max(y, innerHeight - y),
        );
        document.startViewTransition(swap).ready.then(() => {
          document.documentElement.animate(
            {
              clipPath: [
                `circle(0px at ${x}px ${y}px)`,
                `circle(${end}px at ${x}px ${y}px)`,
              ],
            },
            {
              duration: 480,
              easing: "cubic-bezier(0.2, 0.7, 0.2, 1)",
              pseudoElement: "::view-transition-new(root)",
            },
          );
        });
      }
      function toggleTheme(origin) {
        const next = currentTheme() === "light" ? "dark" : "light";
        try {
          localStorage.setItem(THEME_KEY, next);
        } catch {
          /* file:// may block storage */
        }
        applyTheme(next, origin);
      }
      // Until someone picks a theme, follow the OS setting as it changes.
      matchMedia("(prefers-color-scheme: light)").addEventListener(
        "change",
        (e) => {
          if (!savedTheme()) applyTheme(e.matches ? "light" : "dark");
        },
      );

      syncThemeSwitch();
      app.route = parseRoute();
      render();
      openLinkedArtifact();
      try {
        if (!localStorage.getItem("patchmill-name")) openNameDialog();
      } catch {
        /* Storage can be unavailable for file URLs. */
      }
    </script>
  </body>
</html>
